name: Buerokratt DSL

on:
  push:
    branches:
      - v3.3.0
    paths:
       - '.env'

jobs:
  aggregate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Central Repository
        uses: actions/checkout@v4

      - name: Sync Files
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/aggregate-files.sh
          $GITHUB_WORKSPACE/scripts/aggregate-files.sh

      - name: Commit Changes to Central Repo
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Aggregated files from source repos [$(date +'%Y-%m-%d')]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
